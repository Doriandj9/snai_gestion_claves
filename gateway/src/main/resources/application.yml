
spring:
  application:
    name: "gateway"
  config:
    import: optional:consul:/
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: inventario
              uri: http://localhost:8088
              predicates:
                - Path= /api/auth/***, /api/users/**, /api/categories/**, /api/resources/**, /api/subcategories/**, /api/scopes/**, /api/locations/**
              filters:
                name: Retry
                args:
                  retries: 3
                  methods: GET,POST,PUT,DELETE

logging:
  level:
    org.springframework.cloud.gateway: trace
    org.springframework.amqp.rabbit.connection.CachingConnectionFactory: WARN
server:
  port: 8090
